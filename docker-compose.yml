services:
  postgres:
    image: postgres:16
    container_name: study-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: studydb
      POSTGRES_USER: studyuser
      POSTGRES_PASSWORD: study-local-password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyuser -d studydb"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
